<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 24px 28px; background: var(--paper); }
  .eyebrow { font: var(--fw-medium) 13px var(--font-sans); color: var(--ink-muted);

       font-size: clamp(48px, 7vw, 92px); line-height: 0.94; letter-spacing: -3px; color: var(--ink); }
  .spec { font: var(--fw-medium) 11px var(--font-mono); color: var(--ink-muted); margin-top: 14px; }
</style>
</head>
<body>
  <p class="eyebrow">性别研究 / AI</p>
  <h1>Future-ready<br/>insights start here.</h1>

</html>
