<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing Scale" subtitle="4 → 92px rhythm" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 22px 28px; background: var(--surface); }
  .row { display: flex; align-items: flex-end; gap: 14px; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .bar { width: 100%; background: var(--accent-soft); border: 1px solid var(--accent-line);
         border-radius: 4px; }
  .v { font: var(--fw-medium) 10px var(--font-mono); color: var(--ink-muted); }
</style>
</head>
<body>
  <div class="row">
    <div class="col"><div class="bar" style="height:4px"></div><span class="v">4</span></div>
    <div class="col"><div class="bar" style="height:8px"></div><span class="v">8</span></div>
    <div class="col"><div class="bar" style="height:12px"></div><span class="v">12</span></div>
    <div class="col"><div class="bar" style="height:16px"></div><span class="v">16</span></div>
    <div class="col"><div class="bar" style="height:20px"></div><span class="v">20</span></div>
    <div class="col"><div class="bar" style="height:28px"></div><span class="v">28</span></div>
    <div class="col"><div class="bar" style="height:34px"></div><span class="v">34</span></div>
    <div class="col"><div class="bar" style="height:44px"></div><span class="v">44</span></div>
    <div class="col"><div class="bar" style="height:64px"></div><span class="v">64</span></div>
    <div class="col"><div class="bar" style="height:92px"></div><span class="v">92</span></div>
  </div>
</body>
</html>
