<!-- @dsCard group="Type" viewport="700x220" name="Headings" subtitle="Editorial title + section title scales" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 24px 28px; background: var(--surface); }
  .kicker { font: var(--fw-bold) 12px var(--font-sans); letter-spacing: 0.22em;
            text-transform: uppercase; color: var(--ink-muted); margin: 0 0 6px; }
  .title { margin: 0 0 18px; font-family: var(--font-sans); font-weight: var(--fw-bold);
           font-size: 46px; line-height: 1.08; letter-spacing: -1.1px; color: var(--ink); }
  .section { margin: 0; font-family: var(--font-sans); font-weight: var(--fw-bold);
             font-size: 34px; letter-spacing: -1.4px; color: var(--ink); }
  .spec { font: var(--fw-medium) 11px var(--font-mono); color: var(--ink-muted); margin-top: 12px; }
</style>
</head>
<body>
  <p class="kicker">Reading</p>
  <h2 class="title">阅读即世界 · The world as a book</h2>
  <h3 class="section">近期阅读 / Recent reading</h3>
  <p class="spec">--title clamp(40–66px) track −1.1px · --section clamp(36–58px) track −1.4px</p>
</body>
</html>
