<!-- @dsCard group="Spacing" viewport="700x160" name="Radii" subtitle="From 10px chips to full pills" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 22px 28px; background: var(--paper); }
  .row { display: flex; gap: 16px; align-items: flex-end; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .box { width: 86px; height: 70px; background: var(--surface); border: var(--hairline);
         box-shadow: var(--shadow-soft); }
  .pill { width: 86px; height: 40px; border-radius: var(--radius-pill); background: var(--surface);
          border: var(--hairline); box-shadow: var(--shadow-soft); }
  .v { font: var(--fw-medium) 11px var(--font-mono); color: var(--ink-muted); }
</style>
</head>
<body>
  <div class="row">
    <div class="col"><div class="box" style="border-radius:var(--radius-sm)"></div><span class="v">sm · 10</span></div>
    <div class="col"><div class="box" style="border-radius:var(--radius-md)"></div><span class="v">md · 16</span></div>
    <div class="col"><div class="box" style="border-radius:var(--radius-lg)"></div><span class="v">lg · 20</span></div>
    <div class="col"><div class="box" style="border-radius:var(--radius-xl)"></div><span class="v">xl · 24</span></div>
    <div class="col"><div class="pill"></div><span class="v">pill · 999</span></div>
  </div>
</body>
</html>
