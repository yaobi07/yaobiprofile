<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--paper); }
  .row { display: flex; gap: 12px; }
  .sw { flex: 1; border-radius: var(--radius-sm); height: 80px; border: 1px solid var(--border);
        display: flex; flex-direction: column; justify-content: flex-end; padding: 9px 11px; background: #fff; }
  .chip { width: 100%; height: 26px; border-radius: var(--radius-sm); margin-bottom: auto; }
  .name { font: var(--fw-semi) 12px var(--font-sans); color: var(--ink); }
  .hex  { font: var(--fw-medium) 10px var(--font-mono); color: var(--ink-muted); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="border:1px solid var(--border)"></div><span class="name">--border</span><span class="hex">ink / 0.10</span></div>
    <div class="sw"><div class="chip" style="background:var(--wash-ink-2)"></div><span class="name">--wash-ink-2</span><span class="hex">ink / 0.08</span></div>
    <div class="sw"><div class="chip" style="background:var(--wash-paper)"></div><span class="name">--wash-paper</span><span class="hex">paper / 0.45</span></div>
    <div class="sw"><div class="chip" style="background:var(--accent-soft)"></div><span class="name">--accent-soft</span><span class="hex">accent / 0.12</span></div>
    <div class="sw"><div class="chip" style="background:var(--accent-ring)"></div><span class="name">--accent-ring</span><span class="hex">accent / 0.45</span></div>
  </div>
</body>
</html>
