<!-- @dsCard group="Spacing" viewport="700x180" name="Shadows & Cards" subtitle="Ink-tinted soft elevation" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 26px 28px; background: var(--paper); }
  .row { display: flex; gap: 26px; }
  .col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .card { width: 100%; height: 92px; background: var(--surface); border: var(--hairline);
          border-radius: var(--radius-lg); }
  .v { font: var(--fw-medium) 11px var(--font-mono); color: var(--ink-muted); text-align: center; }
</style>
</head>
<body>
  <div class="row">
    <div class="col"><div class="card" style="box-shadow:var(--shadow-soft)"></div><span class="v">--shadow-soft<br/>0 12px 40px · ink/.06</span></div>
    <div class="col"><div class="card" style="box-shadow:var(--shadow)"></div><span class="v">--shadow (hover)<br/>0 24px 60px · ink/.08</span></div>
  </div>
</body>
</html>
