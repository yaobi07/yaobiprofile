<!-- @dsCard group="Brand" viewport="700x260" name="Profile Card & Silhouette Art" subtitle="Signature circular feminist illustration" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 24px 28px; background: var(--paper); display: flex; gap: 28px; align-items: center; }
  .art { width: 200px; height: 200px; border-radius: var(--radius-pill); overflow: hidden;
         border: var(--hairline); box-shadow: var(--shadow); flex: none; }
  .art img { width: 100%; height: 100%; object-fit: cover; }
  .card { width: 220px; border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow); flex: none; }
  .card img { width: 100%; display: block; }
  .note { font: 400 14px/1.6 var(--font-sans); color: var(--ink-muted); max-width: 28ch; }
  .note b { color: var(--ink); font-weight: var(--fw-semi); }
</style>
</head>
<body>
  <div class="art"><img src="../assets/avatar.jpg" alt="circular silhouette illustration" /></div>
  <div class="card"><img src="../assets/hero-profile-card.png" alt="profile card on navy" /></div>
  <p class="note"><b>The portrait mark.</b> A warm, multi-hued grid of women's silhouettes — the visual heart of the gender-studies practice. Used as avatar, hero medallion, and profile-card focal point.</p>
</body>
</html>
