<!-- @dsCard group="Type" viewport="700x150" name="Eyebrow & Mono Tags" subtitle="Uppercase labels and monospace tags" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 22px 28px; background: var(--paper); display: flex; flex-direction: column; gap: 16px; }
  .eyebrow { font: var(--fw-bold) 12px var(--font-sans); letter-spacing: 0.16em;
             text-transform: uppercase; color: var(--ink-muted); }
  .tags { display: flex; gap: 8px; flex-wrap: wrap; }
  .tag { font: 400 12px var(--font-mono); padding: 6px 8px; border-radius: var(--radius-sm);
         border: var(--hairline); background: var(--wash-paper); color: var(--ink-body); }
  .spec { font: var(--fw-medium) 11px var(--font-mono); color: var(--ink-muted); }
</style>
</head>
<body>
  <span class="eyebrow">About me · 关于我</span>
  <div class="tags">
    <span class="tag">写作</span><span class="tag">SPSS</span><span class="tag">数据可视化</span>
    <span class="tag">SQL</span><span class="tag">明听影思</span>
  </div>
  <span class="spec">eyebrow 12px / 0.16em uppercase · tag mono 12px on --wash-paper</span>
</body>
</html>
