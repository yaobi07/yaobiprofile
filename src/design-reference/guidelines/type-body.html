<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>

  .body { margin: 0; font: 400 16px/1.68 var(--font-sans); color: var(--ink-body); max-width: 64ch; }

<body>
  <p class="lead">你好，我是咬笔，欢迎！我专注于将业务原始数据转化为可解释、可决策的可视化结果。</p>

  <p class="spec">--lead 19px/1.5 · --body 16px/1.55 (prose 1.68) · track 0.2px</p>
