<!-- @dsCard group="Colors" viewport="700x150" name="Accent & Slate" subtitle="Terracotta brand accent + cool slate counter" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--paper); }
  .row { display: flex; gap: 12px; }
  .sw { flex: 1; border-radius: var(--radius-md); height: 96px; border: var(--hairline);
        display: flex; flex-direction: column; justify-content: flex-end; padding: 10px 12px; color: #fff; }
  .name { font: var(--fw-semi) 13px var(--font-sans); }
  .hex  { font: var(--fw-medium) 11px var(--font-mono); opacity: 0.85; margin-top: 2px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--accent)"><span class="name">--accent</span><span class="hex">#c54b3c</span></div>
    <div class="sw" style="background:var(--accent-warm)"><span class="name">--accent-warm</span><span class="hex">#e07a5f</span></div>
    <div class="sw" style="background:var(--accent-ink)"><span class="name">--accent-ink</span><span class="hex">#c51414</span></div>
    <div class="sw" style="background:var(--slate)"><span class="name">--slate</span><span class="hex">#2f4f6f</span></div>
  </div>
</body>
</html>
