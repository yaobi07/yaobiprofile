<!-- @dsCard group="Brand" viewport="700x150" name="Wordmark" subtitle="咬笔 lockup with gradient brand dot" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 26px 28px; background: var(--paper); display: flex; align-items: center; gap: 40px; }
  .brand { display: inline-flex; align-items: center; gap: 10px; color: var(--ink);
           font-weight: var(--fw-bold); letter-spacing: 0.3px; text-transform: uppercase; font-size: 13px; }
  .dot { width: 10px; height: 10px; border-radius: var(--radius-pill);
         background: linear-gradient(135deg, var(--accent), var(--accent-warm));
         box-shadow: 0 0 0 4px rgba(197,75,60,0.15); }
  .big { display: inline-flex; align-items: center; gap: 16px; }
  .big .dot { width: 18px; height: 18px; box-shadow: 0 0 0 6px rgba(197,75,60,0.15); }
  .name { font: var(--fw-black) 40px var(--font-sans); letter-spacing: -1px; color: var(--ink); }
  .sub { font: var(--fw-medium) 13px var(--font-sans); color: var(--ink-muted); margin-left: 4px; }
</style>
</head>
<body>
  <div class="brand"><span class="dot"></span><span>咬笔</span></div>
  <div class="big"><span class="dot"></span><span class="name">咬笔</span><span class="sub">性别研究 / AI</span></div>
</body>
</html>
