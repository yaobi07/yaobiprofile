<!-- @dsCard group="Portfolio" viewport="1440x1000" name="写作站 · 方向B 金句剧场" -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>明听影思 · 金句剧场</title>
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; }
  .B {
    --line: rgba(28,25,23,0.13);
    --ys-cursor: url('../../assets/pen-cursor.svg') 6 28, crosshair;
    position: relative; isolation: isolate; min-height: 100vh;
    background: linear-gradient(180deg, var(--paper) 0%, var(--paper-warm) 130%);
    cursor: var(--ys-cursor); overflow-x: clip;
  }
  .B a, .B button { cursor: var(--ys-cursor); }
  .serif { font-family: var(--font-serif); }
  .kick { font: var(--fw-bold) 12px/1 var(--font-sans); letter-spacing: 0.34em; text-transform: uppercase; color: var(--ink-muted); }

  /* numbered editorial plate */
  .plate { position: relative; display: grid; grid-template-columns: 132px 1fr; gap: 0;
    border-top: 2px solid var(--ink); cursor: var(--ys-cursor);
    transition: transform 420ms cubic-bezier(.22,1,.36,1); will-change: transform; }
  .plate:last-child { border-bottom: 2px solid var(--ink); }
  .plate .num { font-family: var(--font-serif); font-weight: 900; font-size: clamp(40px,4.6vw,76px);
    line-height: 1; color: transparent; -webkit-text-stroke: 1.5px var(--ink); padding: 26px 0 0 4px;
    transition: color 420ms ease, -webkit-text-stroke-color 420ms ease; }
  .plate .row { display: grid; grid-template-columns: 1fr 240px; gap: 30px; padding: 26px 6px 30px 24px; align-items: center; }
  .plate .ttl { margin: 0; font-family: var(--font-serif); font-weight: 700; letter-spacing: -0.4px;
    font-size: clamp(26px,2.8vw,46px); line-height: 1.16; color: var(--ink); transition: color 360ms ease; }
  .plate .ex { margin: 12px 0 0; color: var(--ink-muted); font-size: 15px; line-height: 1.62; max-width: 46ch;
    transition: color 360ms ease; }
  .plate .meta { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  .plate .tg { font-family: var(--font-mono); font-size: 11px; padding: 5px 9px; border-radius: 8px;
    border: 1px solid var(--line); color: var(--ink-body); transition: all 360ms ease; }
  .plate .win { position: relative; aspect-ratio: 4/3; border-radius: 8px; overflow: hidden;
    background: var(--paper-warm); border: 1px solid var(--line); }
  .plate .win img { width: 100%; height: 100%; object-fit: cover; transition: transform 620ms cubic-bezier(.22,1,.36,1); }
  .plate .hint { position: absolute; right: 0; bottom: -2px; opacity: 0; transform: translateY(8px);
    font: var(--fw-bold) 12px var(--font-sans); letter-spacing: 0.12em; color: var(--paper);
    background: var(--ink); padding: 7px 13px; border-radius: 999px 999px 0 999px;
    transition: opacity 300ms ease, transform 300ms ease; }
  .plate:hover { transform: scale(1.018); z-index: 4; }
  .plate:hover .num { color: var(--pc); -webkit-text-stroke-color: var(--pc); }
  .plate:hover .ttl { color: var(--pc); }
  .plate:hover .ex { color: var(--ink-body); }
  .plate:hover .win img { transform: scale(1.08); }
  .plate:hover .hint { opacity: 1; transform: translateY(0); }
  .plate.sealed .win { display: flex; align-items: center; justify-content: center; border-style: dashed;
    color: var(--ink-muted); font-size: 12px; font-weight: 600; }
  @media (max-width: 820px){ .plate { grid-template-columns: 78px 1fr; } .plate .row { grid-template-columns: 1fr; } .plate .win { display:none; } }

  /* dramatic reverse band */
  .band { position: relative; background: var(--ink-night); color: var(--paper); overflow: hidden; }
  .band::before { content:""; position:absolute; inset:0;
    background: radial-gradient(ellipse 60% 80% at 80% 20%, rgba(226,59,46,0.20), transparent 60%),
                radial-gradient(ellipse 50% 60% at 10% 90%, rgba(33,74,214,0.22), transparent 60%); }

  /* modal */
  .scrim { position: fixed; inset: 0; z-index: 80; background: rgba(20,14,11,0.5);
    backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; padding: 24px;
    opacity: 0; pointer-events: none; transition: opacity 240ms ease; }
  .scrim.show { opacity: 1; pointer-events: auto; }
  .sheet { width: min(900px,100%); max-height: 88vh; overflow: auto; background: var(--surface);
    border-radius: 20px; box-shadow: 0 40px 100px rgba(0,0,0,0.45); transform: translateY(16px) scale(0.98);
    transition: transform 300ms cubic-bezier(.22,1,.36,1); display: grid; grid-template-columns: 0.85fr 1.15fr; }
  .scrim.show .sheet { transform: none; }
  .sheet .cover { background: var(--paper-warm); }
  .sheet .cover img { width: 100%; height: 100%; object-fit: cover; min-height: 320px; }
  .sheet .sbody { padding: 34px; }
  @media (max-width: 720px){ .sheet { grid-template-columns: 1fr; } .sheet .cover img { min-height: 200px; } }
  @media (prefers-reduced-motion: reduce){ *{ animation: none !important; transition: none !important; } }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="./content.js"></script>
<script type="text/babel" src="./CursorTrail.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { brand, hero, series } = window.YAOBI;
const SLAB = ['var(--accent-hot)','var(--cobalt)','var(--ink-night)'];

function useScrollY(){
  const [y,setY] = React.useState(0);
  React.useEffect(()=>{
    let raf=0; const on=()=>{ cancelAnimationFrame(raf); raf=requestAnimationFrame(()=>setY(window.scrollY)); };
    window.addEventListener('scroll',on,{passive:true}); on();
    return ()=>{ window.removeEventListener('scroll',on); cancelAnimationFrame(raf); };
  },[]);
  return y;
}

function Nav(){
  return (
    <header style={{position:'sticky',top:0,zIndex:50,display:'flex',alignItems:'center',justifyContent:'space-between',
      padding:'16px 34px',backdropFilter:'blur(12px)',background:'rgba(250,246,242,0.8)',borderBottom:'2px solid var(--ink)'}}>
      <a href="#top" style={{display:'inline-flex',alignItems:'baseline',gap:11,textDecoration:'none',color:'var(--ink)'}}>
        <span style={{fontWeight:800,fontSize:18,letterSpacing:'0.5px'}}>咬笔</span>
        <span className="serif" style={{fontSize:16,color:'var(--ink-muted)'}}>明听影思</span>
      </a>
      <nav style={{display:'flex',gap:6,alignItems:'center'}}>
        {series.map(s=>(
          <a key={s.id} href={'#'+s.id} className="kick" style={{textDecoration:'none',color:'var(--ink)',padding:'8px 12px'}}>{s.en}</a>
        ))}
        <a href="#contact" className="kick" style={{textDecoration:'none',color:'var(--paper)',background:'var(--ink)',padding:'9px 15px',borderRadius:999}}>联系</a>
      </nav>
    </header>
  );
}

function Hero(){
  const [i,setI] = React.useState(0);
  React.useEffect(()=>{ const t=setInterval(()=>setI(v=>(v+1)%hero.length),4600); return ()=>clearInterval(t); },[]);
  const slab = SLAB[i%SLAB.length];
  const onAcid = false;
  return (
    <section id="top" style={{maxWidth:1320,margin:'0 auto',padding:'52px 34px 30px'}}>
      <div style={{display:'flex',alignItems:'center',gap:14,marginBottom:22}}>
        <span className="kick">公众号 · 写作档案</span>
        <span style={{flex:1,height:2,background:'var(--ink)'}}/>
        <span className="serif" style={{fontSize:15,color:'var(--ink-muted)'}}>{brand.tagline}</span>
      </div>
      <div style={{position:'relative',borderRadius:'10px',overflow:'hidden',background:slab,
        transition:'background 800ms ease',padding:'clamp(34px,5vw,72px) clamp(28px,4vw,56px)',minHeight:'min(52vw,460px)',
        display:'flex',alignItems:'center'}}>
        <span aria-hidden="true" className="serif" style={{position:'absolute',right:'-2vw',bottom:'-8vw',fontSize:'34vw',
          lineHeight:1,fontWeight:900,color:'rgba(250,246,242,0.10)',pointerEvents:'none',userSelect:'none'}}>「」</span>
        {hero.map((h,idx)=>(
          <h1 key={idx} className="serif" aria-hidden={idx!==i} style={{position:idx===0?'relative':'absolute',
            left:'clamp(28px,4vw,56px)',right:'clamp(28px,4vw,56px)',margin:0,fontWeight:900,
            fontSize:'clamp(42px,7vw,108px)',lineHeight:1.04,letterSpacing:'-0.01em',color:'var(--paper)',
            whiteSpace:'pre-line',opacity:idx===i?1:0,transform:idx===i?'none':'translateY(20px)',
            transition:'opacity 700ms ease, transform 700ms ease'}}>
            {h.text}
          </h1>
        ))}
      </div>
      <div style={{display:'flex',alignItems:'center',gap:18,marginTop:22,flexWrap:'wrap'}}>
        <span className="serif" style={{fontSize:16,color:'var(--ink)'}}>— {hero[i].from}</span>
        <span style={{flex:1,minWidth:60,height:2,background:'var(--ink)'}}/>
        <div style={{display:'flex',gap:7}}>
          {hero.map((_,idx)=>(
            <button key={idx} onClick={()=>setI(idx)} aria-label={'金句'+(idx+1)} style={{width:idx===i?28:11,height:11,
              borderRadius:999,border:'2px solid var(--ink)',background:idx===i?'var(--ink)':'transparent',transition:'all 300ms ease'}}/>
          ))}
        </div>
      </div>
      <p style={{maxWidth:'54ch',marginTop:26,color:'var(--ink-body)',fontSize:18,lineHeight:1.72}}>{brand.intro}</p>
    </section>
  );
}

function Plate({a,s,n,onOpen}){
  const sealed = a.needsContent;
  return (
    <article className={'plate'+(sealed?' sealed':'')} style={{'--pc':s.color}}
      onClick={()=> sealed ? window.open(a.href,'_blank') : onOpen(a,s)}>
      <div className="num">{String(n).padStart(2,'0')}</div>
      <div className="row">
        <div>
          <span className="kick" style={{color:s.color}}>{s.en}</span>
          <h3 className="ttl" style={{marginTop:10}}>{sealed ? '新文章 · 点击阅读原文' : a.title}</h3>
          {!sealed && <p className="ex">{a.excerpt}</p>}
          <div className="meta">{a.tags.map(t=>(<span key={t} className="tg">{t}</span>))}</div>
        </div>
        <div className="win">
          {sealed ? <span>未命名 · 待补金句</span> : <img src={a.cover} alt="" loading="lazy"/>}
          <span className="hint">{sealed?'阅读原文 →':'点击预览 →'}</span>
        </div>
      </div>
    </article>
  );
}

function Series({s,onOpen,start}){
  return (
    <section id={s.id} style={{maxWidth:1320,margin:'0 auto',padding:'60px 34px 20px'}}>
      <div style={{display:'flex',alignItems:'flex-end',gap:22,flexWrap:'wrap',marginBottom:28}}>
        <h2 className="serif" style={{margin:0,fontSize:'clamp(46px,7vw,104px)',fontWeight:900,lineHeight:0.92,
          letterSpacing:'-0.02em',color:'var(--ink)'}}>{s.name}<span style={{color:s.color}}>·{s.en}</span></h2>
        <p style={{margin:0,maxWidth:'42ch',color:'var(--ink-muted)',fontSize:15,lineHeight:1.6,paddingBottom:8}}>{s.blurb}</p>
      </div>
      <div>{s.articles.map((a,i)=>(<Plate key={i} a={a} s={s} n={start+i} onOpen={onOpen}/>))}</div>
    </section>
  );
}

function QuoteBand({text,from,y,base}){
  const off = (y - base) * 0.05;
  return (
    <section className="band" style={{padding:'clamp(70px,11vw,150px) 34px'}}>
      <div style={{maxWidth:1180,margin:'0 auto',position:'relative'}}>
        <blockquote className="serif" style={{margin:0,fontSize:'clamp(36px,6.4vw,92px)',lineHeight:1.12,fontWeight:700,
          color:'var(--paper)',transform:`translateX(${Math.max(-50,Math.min(50,off))}px)`,transition:'transform 80ms linear'}}>
          <span style={{color:'var(--accent-warm)'}}>「</span>{text}<span style={{color:'var(--accent-warm)'}}>」</span>
        </blockquote>
        <p className="kick" style={{marginTop:24,color:'rgba(250,246,242,0.62)'}}>{from}</p>
      </div>
    </section>
  );
}

function Modal({data,onClose}){
  const a = data && data.a, s = data && data.s;
  React.useEffect(()=>{
    const k=e=>{ if(e.key==='Escape') onClose(); };
    window.addEventListener('keydown',k); return ()=>window.removeEventListener('keydown',k);
  },[onClose]);
  return (
    <div className={'scrim'+(data?' show':'')} onClick={onClose}>
      {a && (
        <div className="sheet" onClick={e=>e.stopPropagation()}>
          <div className="cover"><img src={a.cover} alt=""/></div>
          <div className="sbody">
            <span className="kick" style={{color:s.color}}>{s.en} · {s.name}系列</span>
            <h3 className="serif" style={{margin:'14px 0 0',fontSize:'clamp(24px,3vw,36px)',lineHeight:1.25,fontWeight:700,color:'var(--ink)'}}>{a.title}</h3>
            <blockquote className="serif" style={{margin:'24px 0',fontSize:'clamp(22px,2.6vw,32px)',lineHeight:1.3,fontWeight:500,color:s.color}}>「{a.quote}」</blockquote>
            <p style={{margin:0,color:'var(--ink-body)',fontSize:16,lineHeight:1.8}}>{a.excerpt}</p>
            <div style={{display:'flex',gap:8,margin:'22px 0 26px',flexWrap:'wrap'}}>
              {a.tags.map(t=>(<span key={t} style={{fontFamily:'var(--font-mono)',fontSize:12,padding:'6px 9px',borderRadius:9,border:'1px solid var(--line)',color:'var(--ink-body)'}}>{t}</span>))}
            </div>
            <a href={a.href} target="_blank" rel="noreferrer" style={{display:'inline-flex',alignItems:'center',gap:10,padding:'12px 20px',borderRadius:999,
              background:'var(--ink)',color:'#fff',textDecoration:'none',fontWeight:650,boxShadow:'0 14px 30px rgba(28,25,23,0.25)'}}>在公众号阅读全文 <span>→</span></a>
            <button onClick={onClose} style={{marginLeft:12,padding:'12px 18px',borderRadius:999,border:'1px solid var(--line)',background:'var(--surface)',color:'var(--ink-body)',fontWeight:600}}>关闭</button>
          </div>
        </div>
      )}
    </div>
  );
}

function Merit(){
  const [t,setT]=React.useState([]);
  const ping=()=>{ const id=performance.now(); setT(v=>[...v,id]); setTimeout(()=>setT(v=>v.filter(x=>x!==id)),900); };
  return (
    <span style={{position:'relative',display:'inline-flex'}}>
      <button onClick={ping} style={{padding:'13px 22px',borderRadius:999,border:'2px solid var(--ink)',
        background:'var(--acid)',color:'var(--ink-night)',fontWeight:800,letterSpacing:'0.04em'}}>功德 +1</button>
      <span aria-hidden="true" style={{position:'absolute',inset:0,pointerEvents:'none'}}>
        {t.map(id=>(<span key={id} className="serif" style={{position:'absolute',left:'50%',top:-6,transform:'translateX(-50%)',
          color:'var(--accent-hot)',fontWeight:900,whiteSpace:'nowrap',animation:'meritF 900ms ease-out forwards'}}>功德+1</span>))}
      </span>
      <style>{`@keyframes meritF{0%{opacity:0;transform:translate(-50%,8px)}20%{opacity:1;transform:translate(-50%,-2px)}100%{opacity:0;transform:translate(-50%,-32px)}}`}</style>
    </span>
  );
}

function App(){
  const y = useScrollY();
  const [modal,setModal] = React.useState(null);
  const open = (a,s)=> setModal({a,s});
  return (
    <div className="B">
      <div style={{position:'absolute',inset:0,overflow:'hidden',pointerEvents:'none'}}><CursorTrail/></div>
      <Nav/>
      <main>
        <Hero/>
        <Series s={series[0]} onOpen={open} start={1}/>
        <QuoteBand text="无需人性，只需生产。" from="到达 · 孕肚与母职" y={y} base={1400}/>
        <Series s={series[1]} onOpen={open} start={series[0].articles.length+1}/>
        <QuoteBand text="我们失去的，是面对它的语言。" from="自由戏 · 性解放" y={y} base={2900}/>
        <section id="contact" style={{maxWidth:1320,margin:'0 auto',padding:'56px 34px 90px'}}>
          <div style={{border:'2px solid var(--ink)',borderRadius:20,padding:'40px 34px',background:'var(--surface)',
            display:'flex',alignItems:'center',justifyContent:'space-between',gap:24,flexWrap:'wrap'}}>
            <div>
              <span className="kick">SAY HELLO</span>
              <p className="serif" style={{margin:'12px 0 0',fontSize:'clamp(26px,3.4vw,46px)',fontWeight:800,color:'var(--ink)'}}>读到这里，要不要聊聊？</p>
              <p style={{margin:'10px 0 0',color:'var(--ink-muted)'}}>邮箱：<a href={'mailto:'+brand.email} style={{color:'var(--ink)',borderBottom:'3px solid var(--accent)',textDecoration:'none'}}>{brand.email}</a></p>
            </div>
            <Merit/>
          </div>
          <p style={{marginTop:26,color:'var(--ink-muted)',fontSize:13}}>© {new Date().getFullYear()} 咬笔 · 明听影思　|　{brand.sub}</p>
        </section>
      </main>
      <Modal data={modal} onClose={()=>setModal(null)}/>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
