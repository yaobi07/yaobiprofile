/* tokens/colors.css */
/* ─────────────────────────────────────────────────────────
   Yaobi · Color tokens
   "Mostly Serious" — warm paper, ink text, terracotta accent.
   Lifted verbatim from the portfolio source (src/index.css).
   ───────────────────────────────────────────────────────── */
:root {
  /* — Base / paper — */
  --paper:        #faf6f2;   /* page background, warm off-white */
  --paper-warm:   #f5ebe3;   /* deeper warm paper, gradients / media wells */
  --surface:      #ffffff;   /* cards, panels */
  --surface-raise:#fffefb;   /* hover state of a white surface */
  --surface-sink: #fdfaf7;   /* gradient floor of raised cards */

  /* — Ink / text — */
  --ink:          #1c1917;   /* strongest text, headlines */
  --ink-body:     #3f3c39;   /* default body copy */
  --ink-muted:    #6b6560;   /* secondary / eyebrow / meta */

  /* — Accent (terracotta) — */
  --accent:       #c54b3c;   /* primary brand accent */
  --accent-warm:  #e07a5f;   /* lighter terracotta, gradient partner */
  --accent-ink:   #c51414;   /* saturated ink-red, used for the cursor trail */

  /* — Secondary (slate) — */
  --slate:        #2f4f6f;   /* cool counter-accent, gradient partner */

  /* — Bold brand extensions (writing portfolio) — */
  --accent-hot:   #e23b2e;   /* saturated terracotta for big moments */
  --cobalt:       #214ad6;   /* bold electric-blue second color */
  --acid:         #d6e34a;   /* acid chartreuse pop (used sparingly) */
  --ink-night:    #20140f;   /* warm near-black for dramatic blocks */

  /* — Lines & washes (all derived from ink @ low alpha) — */
  --border:        rgba(28, 25, 23, 0.10);  /* hairline borders */
  --border-strong: rgba(28, 25, 23, 0.14);  /* hover / emphasis border */
  --wash-ink-1:    rgba(28, 25, 23, 0.05);   /* nav hover fill */
  --wash-ink-2:    rgba(28, 25, 23, 0.08);   /* inactive dots */
  --wash-paper:    rgba(245, 235, 227, 0.45);/* tag fill */

  /* — Accent washes — */
  --accent-soft:   rgba(197, 75, 60, 0.12);  /* primary button fill */
  --accent-line:   rgba(197, 75, 60, 0.35);  /* underline rest state */
  --accent-ring:   rgba(197, 75, 60, 0.45);  /* focus ring */
  --slate-soft:    rgba(47, 79, 111, 0.08);  /* primary button fill (partner) */

  /* ── Semantic aliases ── */
  --bg:             var(--paper);
  --bg-elevated:    var(--surface);
  --text:           var(--ink-body);
  --text-strong:    var(--ink);
  --text-muted:     var(--ink-muted);
  --link:           var(--ink);
  --link-underline: var(--accent-line);
  --focus-ring:     var(--accent-ring);
  --surface-card:   var(--surface);
  --media-well:     var(--paper-warm);
}

/* tokens/typography.css */
/* ─────────────────────────────────────────────────────────
   Yaobi · Typography tokens
   System sans + system mono. No webfonts shipped — the brand
   intentionally rides the native UI stack for a clean,
   editorial feel. A Chinese-friendly fallback chain is built
   in (the product copy is primarily 中文).
   ───────────────────────────────────────────────────────── */
:root {
  /* — Families —
     Native UI stack (matches the source repo, which intentionally rides
     system fonts). system-ui / -apple-system resolve to the platform CJK
     face (PingFang on macOS/iOS, Microsoft YaHei on Windows, Noto on
     Android/Linux) with no webfont to ship. */
  --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
    "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
    "Liberation Mono", "Courier New", monospace;
  /* Editorial serif — literary 宋体 voice for big titles & 金句.
     Webfont declared in tokens/fonts.css (Noto Serif SC). */
  --font-serif: "Noto Serif SC", "Songti SC", "SimSun", Georgia,
    "Times New Roman", serif;

  /* — Weights — */
  --fw-regular: 400; /* @kind font */
  --fw-medium:  600; /* @kind font */  /* eyebrows, nav, meta */
  --fw-semi:    650; /* @kind font */  /* buttons, links, card titles */
  --fw-bold:    700; /* @kind font */  /* section + brand */
  --fw-black:   800; /* @kind font */  /* display headline, merit toast */

  /* — Display: oversized, tight, the hero voice — */
  --display-size:   clamp(56px, 7.8vw, 120px);
  --display-line:   0.94;  /* @kind other */
  --display-track:  -3px;   /* @kind other */
  --display-weight: var(--fw-black);

  /* — Heading L: carousel / big editorial titles — */
  --title-size:   clamp(40px, 3.6vw, 66px);
  --title-line:   1.08;    /* @kind other */
  --title-track:  -1.1px;  /* @kind other */

  /* — Heading M: section titles — */
  --section-size:  clamp(36px, 3.8vw, 58px);
  --section-track: -1.4px;  /* @kind other */
  --section-weight: var(--fw-bold);

  /* — Heading S: card / capability titles — */
  --card-title-size:  18px;
  --capability-size:  24px;

  /* — Body — */
  --body-size:   16px;
  --body-line:   1.55;   /* @kind other */
  --body-track:  0.2px;  /* @kind other */
  --lead-size:   19px;   /* subhead / lead paragraph */
  --prose-line:  1.68; /* @kind other */  /* long-form reading line-height */

  /* — Eyebrow / label (uppercase, tracked) — */
  --eyebrow-size:  12px;
  --eyebrow-track: 0.16em;  /* @kind other */
  --eyebrow-weight: var(--fw-bold);

  /* — Mono detail: tags, code — */
  --mono-size:  12px;
  --tag-size:   12px;

  /* ── Semantic aliases ── */
  --text-body:    var(--body-size)/var(--body-line) var(--font-sans);
  --text-display: var(--display-weight) var(--display-size)/var(--display-line) var(--font-sans);
}

/* tokens/fonts.css */
/* ─────────────────────────────────────────────────────────
   Yaobi · Webfonts
   The editorial serif (思源宋体 / Noto Serif SC) used for large
   titles and 金句 in the writing portfolio. Served from Google
   Fonts. Body / UI stay on the native system sans stack.
   ───────────────────────────────────────────────────────── */


/* tokens/spacing.css */
/* ─────────────────────────────────────────────────────────
   Yaobi · Spacing & layout tokens
   8px-ish rhythm with a few in-between steps the source uses.
   ───────────────────────────────────────────────────────── */
:root {
  /* — Spacing scale — */
  --space-1:  4px;
  --space-2:  8px;
  --space-3:  12px;
  --space-4:  16px;
  --space-5:  20px;
  --space-6:  28px;
  --space-7:  34px;
  --space-8:  44px;
  --space-9:  64px;
  --space-10: 92px;   /* section vertical padding */

  /* — Container — */
  --container:     min(1400px, calc(100% - 48px)); /* @kind other */
  --container-wide: min(1540px, calc(100% - 56px)); /* @kind other */
  --gutter:        24px;

  /* — Section rhythm — */
  --section-pad-y: 92px;
  --grid-gap:      20px;

  /* — Background grid texture — */
  --grid-cell: 48px; /* @kind spacing */

  /* ── Semantic aliases ── */
  --stack-sm: var(--space-3);
  --stack-md: var(--space-5);
  --stack-lg: var(--space-9);
}

/* tokens/effects.css */
/* ─────────────────────────────────────────────────────────
   Yaobi · Effects — radii, shadows, borders, motion
   Soft warm shadows (tinted with the ink hue, never neutral
   black), generous rounding, calm easing.
   ───────────────────────────────────────────────────────── */
:root {
  /* — Corner radii — */
  --radius-sm:   10px;   /* nav pills, tags, small chips */
  --radius-md:   16px;   /* capability cards, media wells */
  --radius-lg:   20px;   /* cards */
  --radius-xl:   24px;   /* framed sections / panels */
  --radius-pill: 999px;  /* buttons, dots, avatars */

  /* — Shadows (ink-tinted, diffuse, downward) — */
  --shadow-soft: 0 12px 40px rgba(28, 25, 23, 0.06);
  --shadow:      0 24px 60px rgba(28, 25, 23, 0.08);

  /* — Borders — */
  --border-width: 1px;
  --hairline: var(--border-width) solid var(--border);

  /* — Motion — */
  --ease-out:   cubic-bezier(0.22, 1, 0.36, 1); /* @kind other */
  --ease-std:   ease; /* @kind other */
  --dur-fast:   120ms; /* @kind other */
  --dur-base:   160ms; /* @kind other */
  --dur-slow:   600ms; /* @kind other */
  --dur-carousel: 620ms; /* @kind other */

  /* — Interaction primitives — */
  --lift:        translateY(-2px); /* @kind other */
  --lift-sm:     translateY(-1px); /* @kind other */

  /* — Backdrop blur (sticky bar, glass) — */
  --blur: 14px; /* @kind other */

  /* ── Semantic aliases ── */
  --card-radius:   var(--radius-lg);
  --card-shadow:   var(--shadow-soft);
  --card-shadow-hover: var(--shadow);
  --panel-radius:  var(--radius-xl);
}

/* tokens/base.css */
/* ─────────────────────────────────────────────────────────
   Yaobi · Base / reset
   Minimal element defaults so a bare page already feels
   on-brand. Background texture + the pen cursor are opt-in
   utility classes so they don't leak into card previews.
   ───────────────────────────────────────────────────────── */
*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100svh;
  font-family: var(--font-sans);
  font-size: var(--body-size);
  line-height: var(--body-line);
  letter-spacing: var(--body-track);
  background: var(--paper);
  color: var(--text);
  font-synthesis: none;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

a {
  color: inherit;
}

img {
  display: block;
  max-width: 100%;
}

:focus-visible {
  outline: 2px solid var(--focus-ring);
  outline-offset: 2px;
}

/* ── Opt-in: warm paper backdrop with masked grid texture ──
   Add class "ys-canvas" to a full-bleed page wrapper.        */
.ys-canvas {
  position: relative;
  isolation: isolate;
  min-height: 100svh;
}

.ys-canvas::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -2;
  pointer-events: none;
  background:
    radial-gradient(ellipse 80% 50% at 15% 0%, rgba(245, 235, 227, 0.9), transparent 55%),
    radial-gradient(ellipse 70% 45% at 85% 10%, rgba(232, 240, 248, 0.55), transparent 50%),
    linear-gradient(180deg, var(--paper) 0%, var(--paper-warm) 100%);
}

.ys-canvas::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background-image:
    linear-gradient(rgba(28, 25, 23, 0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(28, 25, 23, 0.035) 1px, transparent 1px);
  background-size: 100% var(--grid-cell), var(--grid-cell) 100%;
  mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.12), transparent 65%);
}

/* ── Opt-in: the pen cursor (asset path is relative to the
   page that applies it; override --ys-cursor if needed). ── */
.ys-pen-cursor,
.ys-pen-cursor a,
.ys-pen-cursor button,
.ys-pen-cursor [role="button"] {
  cursor: var(--ys-cursor, crosshair);
}

  @keyframes floatUp {
    0%,100% { transform: translateY(0px); }
    50%      { transform: translateY(-8px); }
  }
  @keyframes floatDown {
    0%,100% { transform: translateY(0px); }
    50%      { transform: translateY(8px); }
  }
</style>

<script type="text/babel">// Ink-red pen cursor trail — follows the pointer, fades over ~550ms.
// Mirrors the live site's canvas trail (rgba(197,20,20), multiply blend).
function CursorTrail() {
  const ref = React.useRef(null);
  React.useEffect(() => {
    const canvas = ref.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    if (!ctx) return;
    const dpr = Math.max(1, window.devicePixelRatio || 1);
    const points = [];
    const maxAgeMs = 550;
    const host = canvas.parentElement;

    const resize = () => {
      const w = host.clientWidth, h = host.clientHeight;
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      canvas.style.width = w + "px";
      canvas.style.height = h + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };
    resize();

    let raf = 0;
    const draw = () => {
      raf = requestAnimationFrame(draw);
      const now = performance.now();
      while (points.length && now - points[0].t > maxAgeMs) points.shift();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (points.length < 2) return;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      for (let i = 1; i < points.length; i++) {
        const a = points[i - 1], b = points[i];
        const alpha = Math.max(0, 1 - (now - b.t) / maxAgeMs);
        ctx.strokeStyle = `rgba(197, 20, 20, ${0.75 * alpha})`;
        ctx.lineWidth = 1.5 + 3.5 * alpha;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
      }
    };

    const onMove = (e) => {
      const r = host.getBoundingClientRect();
      points.push({ x: e.clientX - r.left, y: e.clientY - r.top, t: performance.now() });
      if (points.length > 90) points.splice(0, points.length - 90);
    };

    window.addEventListener("resize", resize);
    host.addEventListener("pointermove", onMove, { passive: true });
    raf = requestAnimationFrame(draw);
    return () => {
      window.removeEventListener("resize", resize);
      host.removeEventListener("pointermove", onMove);
      cancelAnimationFrame(raf);
    };
  }, []);

  return React.createElement("canvas", {
    ref,
    "aria-hidden": "true",
    style: {
      position: "absolute", inset: 0, zIndex: 40,
      pointerEvents: "none", mixBlendMode: "multiply",
    },
  });
}
window.CursorTrail = CursorTrail;
</script>

<script type="text/babel" data-presets="react">
const { brand, series } = window.YAOBI;

function useScrollY(){
  const [y,setY] = React.useState(0);
  React.useEffect(()=>{
    let raf=0; const on=()=>{ cancelAnimationFrame(raf); raf=requestAnimationFrame(()=>setY(window.scrollY)); };
    window.addEventListener('scroll',on,{passive:true}); on();
    return ()=>{ window.removeEventListener('scroll',on); cancelAnimationFrame(raf); };
  },[]);
  return y;
}

function HeroQuote(){

  React.useEffect(()=>{

  const q=list[i]||{};

    <div className="heroCap">

  );
}

        </div>
        <a href="#archive" className="scrollCue"><span className="arr">↓</span></a>
      </div>

}

function Sheet({data,onClose}){
  const a = data && data.a, s = data && data.s;
  React.useEffect(()=>{
    const k=e=>{ if(e.key==='Escape') onClose(); };
    window.addEventListener('keydown',k); return ()=>window.removeEventListener('keydown',k);
  },[onClose]);
  return (
    <div className={'scrim'+(data?' show':'')} onClick={onClose}>
      {a && (
        <div className="sheet" onClick={e=>e.stopPropagation()}>
          <button className="x" onClick={onClose} aria-label="关闭">×</button>
          <div className="cover">
            <span className="ribbon" style={{background:s.color}}>{s.en} · {s.name}系列</span>
            <img src={a.cover} alt=""/>
          </div>
          <div className="sbody">
            <span className="kicker" style={{color:s.color}}>{s.en} · {s.name}</span>
            <h3 className="serif" style={{margin:'12px 0 18px',fontSize:'clamp(22px,2.8vw,34px)',lineHeight:1.25,fontWeight:700,color:'var(--ink)'}}>{a.title}</h3>
            <blockquote className="q" style={{color:s.color}}>「{a.quote}」</blockquote>
            <p style={{margin:0,color:'var(--ink-body)',fontSize:16,lineHeight:1.85}}>{a.excerpt}</p>
            <div style={{display:'flex',gap:8,margin:'22px 0 26px',flexWrap:'wrap'}}>
              {a.tags.map(t=>(<span key={t} style={{fontFamily:'var(--font-mono)',fontSize:12,padding:'6px 9px',borderRadius:9,border:'1px solid var(--line)',color:'var(--ink-body)'}}>{t}</span>))}
            </div>
            <a href={a.href} target="_blank" rel="noreferrer" style={{display:'inline-flex',alignItems:'center',gap:10,padding:'13px 22px',borderRadius:999,
              background:'var(--ink)',color:'#fff',textDecoration:'none',fontWeight:650,boxShadow:'0 14px 30px rgba(28,25,23,0.25)'}}>在公众号阅读全文 <span>→</span></a>
          </div>
        </div>
      )}
    </div>
  );
}

function ArchiveRow({a,s,n,onOpen}){
  const sealed = a.needsContent;
  return (
    <article className="row" style={{'--rc':s.color}}
      onClick={()=> sealed ? window.open(a.href,'_blank') : onOpen(a,s)}>
      <div className="num">{String(n).padStart(2,'0')}</div>
      <div>
        <span className="kicker" style={{color:s.color}}>{s.en} · {s.name}</span>
        <h3 className="rt" style={{marginTop:8}}>{sealed?'新文章 · 点击阅读原文':a.title}</h3>
        {!sealed && <p className="rx">{a.excerpt}</p>}
        <div className="rmeta">{a.tags.map(t=>(<span key={t} className="tg">{t}</span>))}</div>
      </div>
      <div className="rthumb">{sealed? <span className="seal">未命名</span> : <img src={a.cover} alt="" loading="lazy"/>}</div>
    </article>
  );
}

function App(){
  const y = useScrollY();
  const [modal,setModal] = React.useState(null);
  const open = (a,s)=> setModal({a,s});
  return (
    <div className={'A'+(modal?' reading':'')}>
      <div style={{position:'absolute',inset:0,overflow:'hidden',pointerEvents:'none'}}><CursorTrail/></div>
      <Nav/>
      <main>
        <Stage reading={!!modal} onOpen={open}/>

        <section id="archive" className="archive">
          <div className="archHead">
            <span className="kicker">THE ARCHIVE</span>
          </div>
          <h2 className="serif" style={{margin:'4px 0 30px',fontFamily:'var(--font-serif)',fontWeight:900,fontSize:'clamp(40px,6vw,96px)',lineHeight:0.94,letterSpacing:'-0.02em',color:'var(--ink)'}}>
            全部<span style={{color:'var(--accent-hot)'}}>作品</span>
          </h2>
          {series.filter(s=>s.articles.length>0).map((s)=>(
            <div key={s.id} style={{marginBottom:56}}>
              <div style={{display:'flex',alignItems:'flex-end',gap:18,flexWrap:'wrap',marginBottom:6}}>
                <h3 className="serif" style={{margin:0,fontSize:'clamp(30px,4vw,60px)',fontWeight:900,lineHeight:1,color:'var(--ink)'}}>
                  {s.name}<span style={{color:s.color}}>·{s.en}</span>
                </h3>
                <p style={{margin:0,maxWidth:'44ch',color:'var(--ink-muted)',fontSize:14,lineHeight:1.6,paddingBottom:6}}>{s.blurb}</p>
                <a href={'series.html?id='+s.id} className="kicker" style={{marginLeft:'auto',whiteSpace:'nowrap',textDecoration:'none',color:s.color,paddingBottom:6,transition:'opacity .15s,transform .15s'}} onMouseDown={e=>{e.currentTarget.style.opacity='0.5';e.currentTarget.style.transform='scale(0.95)';}} onMouseUp={e=>{e.currentTarget.style.opacity='';e.currentTarget.style.transform='';}} onMouseLeave={e=>{e.currentTarget.style.opacity='';e.currentTarget.style.transform='';}}>查看全部 →</a>
              </div>
              {s.articles.slice(0,3).map((a,i)=>(<ArchiveRow key={i} a={a} s={s} n={i+1} onOpen={open}/>))}
              
            </div>
          ))}
        </section>

        <section id="contact" style={{padding:'10px 32px 90px',maxWidth:1320,margin:'0 auto'}}>
          <div style={{border:'1px solid var(--line)',borderRadius:22,padding:'44px 38px',background:'var(--surface)',boxShadow:'var(--shadow-soft)',
            display:'flex',alignItems:'center',justifyContent:'space-between',gap:28,flexWrap:'wrap'}}>
            <div style={{maxWidth:560}}>
              <span className="kicker" style={{color:'var(--accent-hot)'}}>JOIN US · 加入我们</span>
              <p className="serif" style={{margin:'14px 0 0',fontSize:'clamp(26px,3.2vw,44px)',fontWeight:800,color:'var(--ink)',lineHeight:1.2}}>如果你也对性别研究感兴趣</p>
              <p style={{margin:'14px 0 0',color:'var(--ink-body)',fontSize:16,lineHeight:1.85}}>有想聊的话题，欢迎加入。</p>
              <p style={{margin:'16px 0 0',color:'var(--ink-muted)'}}>联系方式：<a href={'mailto:'+brand.email} style={{color:'var(--ink)',borderBottom:'2px solid var(--accent-line)',textDecoration:'none',fontWeight:600}}>{brand.email}</a></p>
            </div>
            <Merit/>
          </div>
          <p style={{marginTop:24,color:'var(--ink-muted)',fontSize:13}}>© {new Date().getFullYear()} 咬笔 · 流动Fluidity　|　{brand.tagline}</p>
        </section>
      </main>
      <Sheet data={modal} onClose={()=>setModal(null)}/>
    </div>
  );
}

function Merit(){
  const [t,setT]=React.useState([]);
  const ping=()=>{ const id=performance.now(); setT(v=>[...v,id]); setTimeout(()=>setT(v=>v.filter(x=>x!==id)),900); };
  return (
    <span style={{position:'relative',display:'inline-flex'}}>
      <button onClick={ping} style={{padding:'13px 22px',borderRadius:999,border:'1px solid var(--accent-line)',
        background:'linear-gradient(135deg,var(--accent-soft),rgba(33,74,214,0.08))',color:'var(--ink)',fontWeight:700,boxShadow:'var(--shadow-soft)'}}>神秘按钮</button>
      <span aria-hidden="true" style={{position:'absolute',inset:0,pointerEvents:'none'}}>
        {t.map(id=>(<span key={id} className="serif" style={{position:'absolute',left:'50%',top:-6,transform:'translateX(-50%)',
          color:'var(--accent-hot)',fontWeight:900,whiteSpace:'nowrap',animation:'meritF 900ms ease-out forwards'}}>功德+1</span>))}
      </span>
      <style>{`@keyframes meritF{0%{opacity:0;transform:translate(-50%,8px)}20%{opacity:1;transform:translate(-50%,-2px)}100%{opacity:0;transform:translate(-50%,-32px)}}`}</style>
    </span>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
