/* tokens/colors.css */
/* ─────────────────────────────────────────────────────────
   Yaobi · Color tokens
   "Mostly Serious" — warm paper, ink text, terracotta accent.
   Lifted verbatim from the portfolio source (src/index.css).
   ───────────────────────────────────────────────────────── */
:root {
  /* — Base / paper — */
  --paper:        #faf6f2;   /* page background, warm off-white */
  --paper-warm:   #f5ebe3;   /* deeper warm paper, gradients / media wells */
  --surface:      #ffffff;   /* cards, panels */
  --surface-raise:#fffefb;   /* hover state of a white surface */
  --surface-sink: #fdfaf7;   /* gradient floor of raised cards */

  /* — Ink / text — */
  --ink:          #1c1917;   /* strongest text, headlines */
  --ink-body:     #3f3c39;   /* default body copy */
  --ink-muted:    #6b6560;   /* secondary / eyebrow / meta */

  /* — Accent (terracotta) — */
  --accent:       #c54b3c;   /* primary brand accent */
  --accent-warm:  #e07a5f;   /* lighter terracotta, gradient partner */
  --accent-ink:   #c51414;   /* saturated ink-red, used for the cursor trail */

  /* — Secondary (slate) — */
  --slate:        #2f4f6f;   /* cool counter-accent, gradient partner */

  /* — Bold brand extensions (writing portfolio) — */
  --accent-hot:   #e23b2e;   /* saturated terracotta for big moments */
  --cobalt:       #214ad6;   /* bold electric-blue second color */
  --acid:         #d6e34a;   /* acid chartreuse pop (used sparingly) */
  --ink-night:    #20140f;   /* warm near-black for dramatic blocks */

  /* — Lines & washes (all derived from ink @ low alpha) — */
  --border:        rgba(28, 25, 23, 0.10);  /* hairline borders */
  --border-strong: rgba(28, 25, 23, 0.14);  /* hover / emphasis border */
  --wash-ink-1:    rgba(28, 25, 23, 0.05);   /* nav hover fill */
  --wash-ink-2:    rgba(28, 25, 23, 0.08);   /* inactive dots */
  --wash-paper:    rgba(245, 235, 227, 0.45);/* tag fill */

  /* — Accent washes — */
  --accent-soft:   rgba(197, 75, 60, 0.12);  /* primary button fill */
  --accent-line:   rgba(197, 75, 60, 0.35);  /* underline rest state */
  --accent-ring:   rgba(197, 75, 60, 0.45);  /* focus ring */
  --slate-soft:    rgba(47, 79, 111, 0.08);  /* primary button fill (partner) */

  /* ── Semantic aliases ── */
  --bg:             var(--paper);
  --bg-elevated:    var(--surface);
  --text:           var(--ink-body);
  --text-strong:    var(--ink);
  --text-muted:     var(--ink-muted);
  --link:           var(--ink);
  --link-underline: var(--accent-line);
  --focus-ring:     var(--accent-ring);
  --surface-card:   var(--surface);
  --media-well:     var(--paper-warm);
}

/* tokens/typography.css */
/* ─────────────────────────────────────────────────────────
   Yaobi · Typography tokens
   System sans + system mono. No webfonts shipped — the brand
   intentionally rides the native UI stack for a clean,
   editorial feel. A Chinese-friendly fallback chain is built
   in (the product copy is primarily 中文).
   ───────────────────────────────────────────────────────── */
:root {
  /* — Families —
     Native UI stack (matches the source repo, which intentionally rides
     system fonts). system-ui / -apple-system resolve to the platform CJK
     face (PingFang on macOS/iOS, Microsoft YaHei on Windows, Noto on
     Android/Linux) with no webfont to ship. */
  --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
    "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
    "Liberation Mono", "Courier New", monospace;
  /* Editorial serif — literary 宋体 voice for big titles & 金句.
     Webfont declared in tokens/fonts.css (Noto Serif SC). */
  --font-serif: "Noto Serif SC", "Songti SC", "SimSun", Georgia,
    "Times New Roman", serif;

  /* — Weights — */
  --fw-regular: 400; /* @kind font */
  --fw-medium:  600; /* @kind font */  /* eyebrows, nav, meta */
  --fw-semi:    650; /* @kind font */  /* buttons, links, card titles */
  --fw-bold:    700; /* @kind font */  /* section + brand */
  --fw-black:   800; /* @kind font */  /* display headline, merit toast */

  /* — Display: oversized, tight, the hero voice — */
  --display-size:   clamp(56px, 7.8vw, 120px);
  --display-line:   0.94;  /* @kind other */
  --display-track:  -3px;   /* @kind other */
  --display-weight: var(--fw-black);

  /* — Heading L: carousel / big editorial titles — */
  --title-size:   clamp(40px, 3.6vw, 66px);
  --title-line:   1.08;    /* @kind other */
  --title-track:  -1.1px;  /* @kind other */

  /* — Heading M: section titles — */
  --section-size:  clamp(36px, 3.8vw, 58px);
  --section-track: -1.4px;  /* @kind other */
  --section-weight: var(--fw-bold);

  /* — Heading S: card / capability titles — */
  --card-title-size:  18px;
  --capability-size:  24px;

  /* — Body — */
  --body-size:   16px;
  --body-line:   1.55;   /* @kind other */
  --body-track:  0.2px;  /* @kind other */
  --lead-size:   19px;   /* subhead / lead paragraph */
  --prose-line:  1.68; /* @kind other */  /* long-form reading line-height */

  /* — Eyebrow / label (uppercase, tracked) — */
  --eyebrow-size:  12px;
  --eyebrow-track: 0.16em;  /* @kind other */
  --eyebrow-weight: var(--fw-bold);

  /* — Mono detail: tags, code — */
  --mono-size:  12px;
  --tag-size:   12px;

  /* ── Semantic aliases ── */
  --text-body:    var(--body-size)/var(--body-line) var(--font-sans);
  --text-display: var(--display-weight) var(--display-size)/var(--display-line) var(--font-sans);
}

/* tokens/fonts.css */
/* ─────────────────────────────────────────────────────────
   Yaobi · Webfonts
   The editorial serif (思源宋体 / Noto Serif SC) used for large
   titles and 金句 in the writing portfolio. Served from Google
   Fonts. Body / UI stay on the native system sans stack.
   ───────────────────────────────────────────────────────── */


/* tokens/spacing.css */
/* ─────────────────────────────────────────────────────────
   Yaobi · Spacing & layout tokens
   8px-ish rhythm with a few in-between steps the source uses.
   ───────────────────────────────────────────────────────── */
:root {
  /* — Spacing scale — */
  --space-1:  4px;
  --space-2:  8px;
  --space-3:  12px;
  --space-4:  16px;
  --space-5:  20px;
  --space-6:  28px;
  --space-7:  34px;
  --space-8:  44px;
  --space-9:  64px;
  --space-10: 92px;   /* section vertical padding */

  /* — Container — */
  --container:     min(1400px, calc(100% - 48px)); /* @kind other */
  --container-wide: min(1540px, calc(100% - 56px)); /* @kind other */
  --gutter:        24px;

  /* — Section rhythm — */
  --section-pad-y: 92px;
  --grid-gap:      20px;

  /* — Background grid texture — */
  --grid-cell: 48px; /* @kind spacing */

  /* ── Semantic aliases ── */
  --stack-sm: var(--space-3);
  --stack-md: var(--space-5);
  --stack-lg: var(--space-9);
}

/* tokens/effects.css */
/* ─────────────────────────────────────────────────────────
   Yaobi · Effects — radii, shadows, borders, motion
   Soft warm shadows (tinted with the ink hue, never neutral
   black), generous rounding, calm easing.
   ───────────────────────────────────────────────────────── */
:root {
  /* — Corner radii — */
  --radius-sm:   10px;   /* nav pills, tags, small chips */
  --radius-md:   16px;   /* capability cards, media wells */
  --radius-lg:   20px;   /* cards */
  --radius-xl:   24px;   /* framed sections / panels */
  --radius-pill: 999px;  /* buttons, dots, avatars */

  /* — Shadows (ink-tinted, diffuse, downward) — */
  --shadow-soft: 0 12px 40px rgba(28, 25, 23, 0.06);
  --shadow:      0 24px 60px rgba(28, 25, 23, 0.08);

  /* — Borders — */
  --border-width: 1px;
  --hairline: var(--border-width) solid var(--border);

  /* — Motion — */
  --ease-out:   cubic-bezier(0.22, 1, 0.36, 1); /* @kind other */
  --ease-std:   ease; /* @kind other */
  --dur-fast:   120ms; /* @kind other */
  --dur-base:   160ms; /* @kind other */
  --dur-slow:   600ms; /* @kind other */
  --dur-carousel: 620ms; /* @kind other */

  /* — Interaction primitives — */
  --lift:        translateY(-2px); /* @kind other */
  --lift-sm:     translateY(-1px); /* @kind other */

  /* — Backdrop blur (sticky bar, glass) — */
  --blur: 14px; /* @kind other */

  /* ── Semantic aliases ── */
  --card-radius:   var(--radius-lg);
  --card-shadow:   var(--shadow-soft);
  --card-shadow-hover: var(--shadow);
  --panel-radius:  var(--radius-xl);
}

/* tokens/base.css */
/* ─────────────────────────────────────────────────────────
   Yaobi · Base / reset
   Minimal element defaults so a bare page already feels
   on-brand. Background texture + the pen cursor are opt-in
   utility classes so they don't leak into card previews.
   ───────────────────────────────────────────────────────── */
*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100svh;
  font-family: var(--font-sans);
  font-size: var(--body-size);
  line-height: var(--body-line);
  letter-spacing: var(--body-track);
  background: var(--paper);
  color: var(--text);
  font-synthesis: none;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

a {
  color: inherit;
}

img {
  display: block;
  max-width: 100%;
}

:focus-visible {
  outline: 2px solid var(--focus-ring);
  outline-offset: 2px;
}

/* ── Opt-in: warm paper backdrop with masked grid texture ──
   Add class "ys-canvas" to a full-bleed page wrapper.        */
.ys-canvas {
  position: relative;
  isolation: isolate;
  min-height: 100svh;
}

.ys-canvas::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -2;
  pointer-events: none;
  background:
    radial-gradient(ellipse 80% 50% at 15% 0%, rgba(245, 235, 227, 0.9), transparent 55%),
    radial-gradient(ellipse 70% 45% at 85% 10%, rgba(232, 240, 248, 0.55), transparent 50%),
    linear-gradient(180deg, var(--paper) 0%, var(--paper-warm) 100%);
}

.ys-canvas::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background-image:
    linear-gradient(rgba(28, 25, 23, 0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(28, 25, 23, 0.035) 1px, transparent 1px);
  background-size: 100% var(--grid-cell), var(--grid-cell) 100%;
  mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.12), transparent 65%);
}

/* ── Opt-in: the pen cursor (asset path is relative to the
   page that applies it; override --ys-cursor if needed). ── */
.ys-pen-cursor,
.ys-pen-cursor a,
.ys-pen-cursor button,
.ys-pen-cursor [role="button"] {
  cursor: var(--ys-cursor, crosshair);
}
</style>

          tags: ["表演", "异性恋规范"],
          href: "https://mp.weixin.qq.com/s/xa9yv_M1pCcK5MifQ7XNwQ",
        },
      ],
    },
    {
      id: "other",
      name: "其他",
      en: "EARLY WORKS",
      blurb: "更早的书写与练笔——一些起点。",
      color: "var(--ink-night)",
      articles: [],
    },
  ],

</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { brand, series } = window.YAOBI;
const params = new URLSearchParams(location.search);
const sid = params.get('id') || series[0].id;
const s = series.find(x=>x.id===sid) || series[0];

// quotes for the stage: real 金句 first, fall back to the series blurb
const quotes = (() => {
  const qs = s.articles.filter(a=>a.quote).map(a=>({ text:a.quote, from:`${s.name} · ${a.title}` }));
  return qs.length ? qs : [{ text:s.blurb, from:`${s.name} · ${s.en}` }];
})();
const STAGE_BG = [s.color, 'var(--ink-night)'];

function Stage(){
  const [i,setI]=React.useState(0);
  const [vis,setVis]=React.useState(true);
  const go=(n)=>{ setVis(false); setTimeout(()=>{ setI(n); setVis(true); },480); };
  React.useEffect(()=>{
    if(quotes.length<2) return;
    const t=setInterval(()=>{ setVis(false); setTimeout(()=>{ setI(v=>(v+1)%quotes.length); setVis(true); },480); },4600);
    return ()=>clearInterval(t);
  },[]);
  const q=quotes[i];
  return (
    <section className="stage">
      <div className="stageHead">
        <span className="kick">金句剧场 · {s.en}</span>
        <span className="ln"></span>
        <span className="serif" style={{fontSize:15,color:'var(--ink-muted)'}}>{brand.tagline}</span>
      </div>
      <div className="slab" style={{background:STAGE_BG[i%STAGE_BG.length]}}>
        <span aria-hidden="true" className="serif ghost">「」</span>
        <blockquote className="q" style={{opacity:vis?1:0,transform:vis?'none':'translateY(20px)'}}>
          <span style={{color:'var(--accent-warm)'}}>「</span>{q.text}<span style={{color:'var(--accent-warm)'}}>」</span>
        </blockquote>
      </div>
      <div className="stageFoot">
        <span className="from">— {q.from}</span>
        <span className="ln"></span>
        <div className="dots">
          {quotes.map((_,idx)=>(
            <button key={idx} onClick={()=>go(idx)} aria-label={'金句'+(idx+1)}
              style={{width:idx===i?28:11, background:idx===i?'var(--ink)':'transparent'}}/>
          ))}
        </div>
      </div>
    </section>
  );
}

function Explorer({onOpen}){
  const [act,setAct]=React.useState(0);
  const a=s.articles[act]||{};
  const sealed=a.needsContent;
  const isWide = typeof window!=='undefined' && window.matchMedia('(max-width:900px)').matches;
  const click=(idx)=>{
    const art=s.articles[idx];
    if(isWide){ if(art.needsContent && art.href) window.open(art.href,'_blank'); else if(!art.needsContent) onOpen(art); return; }
    if(art.needsContent && art.href) window.open(art.href,'_blank'); else if(!art.needsContent) onOpen(art);
  };
  return (
    <section className="explore">
      <div className="list">
        {s.articles.map((art,idx)=>(
          <article key={idx} className={'trow'+(idx===act?' on':'')} style={{'--sc':s.color}}
            onMouseEnter={()=>setAct(idx)} onClick={()=>click(idx)}>
            <div className="num">{String(idx+1).padStart(2,'0')}</div>
            <div>
              <span className="kick tk" style={{color:s.color}}>{s.en}</span>
              <h3 className="tt" style={{marginTop:4}}>{art.needsContent?(art.href?'新文章 · 点击阅读原文':'早期作品 · 待补内容'):art.title}</h3>
            </div>
            <span className="arr">→</span>
          </article>
        ))}
      </div>
      <div className="preview">
        <div className="pcard">
          <div className={'cov'+(a.cover?'':' empty')} key={'c'+act}>
            {a.cover ? <img className="fade" src={a.cover} alt=""/> : <span>未命名 · 待补金句</span>}
            <span className="ribbon" style={{background:s.color}}>{s.en} · {s.name}</span>
          </div>
          <div className="pbody">
            <blockquote className="pq fade" key={'q'+act} style={{color:s.color}}>
              {a.quote ? '「'+a.quote+'」' : (sealed ? '这一篇，正在路上。' : a.title)}
            </blockquote>
            {!sealed && <p className="pt">{a.title}</p>}
            {a.excerpt && <p className="pex">{a.excerpt}</p>}
            <div className="pmeta">{(a.tags||[]).map(t=>(<span key={t} className="tg">{t}</span>))}</div>
            {(!sealed || a.href) && (
              <a className="read" href={a.href||'#'} target={a.href?'_blank':'_self'} rel="noreferrer"
                 onClick={(e)=>{ if(!sealed){ e.preventDefault(); onOpen(a); } }}>
                {sealed?'在公众号阅读原文':'展开预览'} <span>→</span>
              </a>
            )}
          </div>
        </div>
      </div>
    </section>
  );
}

function Sheet({data,onClose}){
  const a=data;
  React.useEffect(()=>{
    const h=e=>{ if(e.key==='Escape') onClose(); };
    window.addEventListener('keydown',h); return ()=>window.removeEventListener('keydown',h);
  },[onClose]);
  return (
    <div onClick={onClose} style={{position:'fixed',inset:0,zIndex:80,background:'rgba(20,14,11,0.5)',backdropFilter:'blur(6px)',
      display:'flex',alignItems:'center',justifyContent:'center',padding:'clamp(16px,3vw,40px)',
      opacity:a?1:0,pointerEvents:a?'auto':'none',transition:'opacity 260ms ease'}}>
      {a && (
        <div onClick={e=>e.stopPropagation()} style={{position:'relative',width:'min(720px,100%)',maxHeight:'90vh',overflow:'auto',
          background:'var(--surface)',borderRadius:18,boxShadow:'0 50px 120px rgba(0,0,0,0.42)'}}>
          <button onClick={onClose} aria-label="关闭" style={{position:'absolute',top:14,right:16,zIndex:2,width:40,height:40,borderRadius:'50%',
            border:'1px solid var(--line)',background:'rgba(255,255,255,0.9)',color:'var(--ink)',fontSize:20}}>×</button>
          {a.cover && (<div style={{position:'relative',background:'#fff',borderBottom:'1px solid var(--line)',borderRadius:'18px 18px 0 0',overflow:'hidden'}}>
            <span style={{position:'absolute',top:16,left:0,color:'#fff',padding:'7px 16px',font:'var(--fw-bold) 11px var(--font-sans)',letterSpacing:'0.2em',textTransform:'uppercase',borderRadius:'0 8px 8px 0',background:s.color}}>{s.en} · {s.name}系列</span>
            <img src={a.cover} alt="" style={{display:'block',width:'100%',maxHeight:300,objectFit:'contain'}}/>
          </div>)}
          <div style={{padding:'clamp(24px,3.4vw,44px)'}}>
            <span className="kick" style={{color:s.color}}>{s.en} · {s.name}</span>
            <h3 className="serif" style={{margin:'12px 0 18px',fontSize:'clamp(22px,2.8vw,34px)',lineHeight:1.25,fontWeight:700,color:'var(--ink)'}}>{a.title||'新文章 · 待补金句'}</h3>
            {a.quote && <blockquote className="serif" style={{margin:'6px 0 22px',fontWeight:600,lineHeight:1.26,fontSize:'clamp(26px,3.4vw,44px)',color:s.color}}>「{a.quote}」</blockquote>}
            {a.excerpt && <p style={{margin:0,color:'var(--ink-body)',fontSize:16,lineHeight:1.85}}>{a.excerpt}</p>}
            {a.href && (<a href={a.href} target="_blank" rel="noreferrer" style={{display:'inline-flex',alignItems:'center',gap:10,marginTop:24,padding:'13px 22px',borderRadius:999,background:'var(--ink)',color:'#fff',textDecoration:'none',fontWeight:650,boxShadow:'0 14px 30px rgba(28,25,23,0.25)'}}>在公众号阅读全文 <span>→</span></a>)}
          </div>
        </div>
      )}
    </div>
  );
}

function Page(){
  const [modal,setModal]=React.useState(null);
  return (
    <div className="S">
      <div className="topbar">
        <a className="back" href="index.html"><span className="a">←</span> 返回书桌</a>
        <span className="brand"><span className="dot" style={{background:s.color}}></span>{brand.name} · {brand.account}</span>
      </div>
      <Stage/>
      <div className="heading">
        <h1>{s.name}</h1>
        <p className="blurb">{s.blurb}</p>
        <span className="cnt">{String(s.articles.length).padStart(2,'0')} 篇</span>
      </div>
      <Explorer onOpen={setModal}/>
      <div className="joinwrap">
        <div className="join">
          <div>
            <span className="kick" style={{color:s.color}}>JOIN US · 加入我们</span>
            <p className="serif" style={{margin:'12px 0 0',fontSize:'clamp(24px,3.2vw,40px)',fontWeight:800,color:'var(--ink)'}}>如果你也对性别研究感兴趣</p>
            <p style={{margin:'12px 0 0',color:'var(--ink-body)',fontSize:16,lineHeight:1.8}}>有想聊的话题，欢迎加入。</p>
            <p style={{margin:'14px 0 0',color:'var(--ink-muted)'}}>联系方式：<a className="mail" href={'mailto:'+brand.email}>{brand.email}</a></p>
          </div>
          <a className="back" href="index.html" style={{border:'2px solid var(--ink)',borderRadius:999,padding:'13px 22px'}}>← 返回全部系列</a>
        </div>
      </div>
      <Sheet data={modal} onClose={()=>setModal(null)}/>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Page/>);
</script>
</body>
</html>
