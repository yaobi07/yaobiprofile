<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>明听影思 · 写作站方向对比</title>
<link rel="stylesheet" href="/styles.css" />
<style>
  html, body { margin: 0; }
  body { background: #e9e2da; min-height: 100vh; font-family: var(--font-sans); color: var(--ink); }
  .wrap { width: max-content; min-width: 100%; box-sizing: border-box; padding: 40px 44px 60px; }
  .top { max-width: 1100px; margin-bottom: 30px; }
  .top .kick { font: 700 12px/1 var(--font-sans); letter-spacing: 0.34em; text-transform: uppercase; color: var(--ink-muted); }
  .top h1 { margin: 12px 0 8px; font-family: var(--font-serif); font-weight: 900; font-size: clamp(30px,4vw,52px);
    line-height: 1.04; letter-spacing: -0.5px; }
  .top p { margin: 0; color: var(--ink-body); font-size: 15px; line-height: 1.6; max-width: 60ch; }
  .row { display: flex; align-items: flex-start; gap: 40px; }
  .col { flex: none; width: 700px; }
  .label { display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px; }
  .label .n { font-family: var(--font-serif); font-weight: 900; font-size: 22px; color: var(--accent); }
  .label .t { font-weight: 700; font-size: 17px; }
  .label .d { color: var(--ink-muted); font-size: 13px; }
  .label a { margin-left: auto; text-decoration: none; font-weight: 650; font-size: 13px; color: var(--paper);
    background: var(--ink); padding: 8px 14px; border-radius: 999px; }
  .frame { width: 700px; height: 880px; border-radius: 4px; overflow: hidden; background: #fff;
    box-shadow: 0 20px 50px rgba(28,25,23,0.18); border: 1px solid rgba(28,25,23,0.12); }
  /* iframe rendered at 1440 wide, scaled to fit the 700px frame */
  .frame iframe { width: 1440px; height: 1810px; border: 0; transform: scale(0.4861); transform-origin: top left; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <p class="kick">公众号《明听影思》· 写作作品集</p>
    <h1>两个方向，一处选择</h1>
    <p>同一批金句与文章，两种呈现：方向 A 是温润的「纸感档案」，文件袋悬停放大、点击预览；方向 B 是大胆的「金句剧场」，色块舞台 + 编号大开本 + 暗场金句。鼠标移到文件/卡片上会放大并提示可点击，点击即可预览正文与金句。</p>
  </div>
  <div class="row">
    <div class="col">
      <div class="label">
        <span class="n">A</span>
        <span class="t">纸感书桌</span>
        <span class="d">书桌摆文件夹 · 拿起即读 · 头像/slogan两侧淡出</span>
        <a href="DirectionA.html" target="_blank" rel="noreferrer">打开 ↗</a>
      </div>
      <div class="frame"><iframe src="DirectionA.html" title="方向 A" loading="lazy"></iframe></div>
    </div>
    <div class="col">
      <div class="label">
        <span class="n">B</span>
        <span class="t">金句剧场</span>
        <span class="d">色块舞台 · 编号大开本 · 暗场金句带</span>
        <a href="DirectionB.html" target="_blank" rel="noreferrer">打开 ↗</a>
      </div>
      <div class="frame"><iframe src="DirectionB.html" title="方向 B" loading="lazy"></iframe></div>
    </div>
  </div>
</div>
</body>
</html>
