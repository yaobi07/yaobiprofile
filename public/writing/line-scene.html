<!-- @dsCard group="Brand" viewport="700x360" name="线描动画 · 书桌写作" subtitle="极简线条:翻书 + 写字,连续循环" -->
<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>线描动画 · 书桌写作</title>
<link rel="stylesheet" href="/styles.css"/>
<style>
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; display:grid; place-items:center;
    background: radial-gradient(ellipse 80% 70% at 50% 30%, var(--paper) 0%, var(--paper-warm) 120%);
    font-family:var(--font-sans); }
  .scene{ width:min(560px,86vw); }
  .desk-anim{ display:block; width:100%; height:auto; overflow:visible; }
  .ink{ fill:none; stroke:var(--ink); stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round;
    vector-effect:non-scaling-stroke; }
  .page-fill{ fill:var(--paper); stroke:var(--ink); stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round;
    vector-effect:non-scaling-stroke; }
  .accent{ stroke:var(--accent); }

  /* gentle breathing of the whole figure */
  .figure{ transform-box:fill-box; transform-origin:center bottom; animation: bob 4.6s ease-in-out infinite; }
  @keyframes bob{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-2.5px); } }

  /* the flipping leaf pivots on the spine (its own left edge) */
  .leaf{ transform-box:fill-box; transform-origin:left center; animation: flip 3.8s ease-in-out infinite; }
  @keyframes flip{
    0%   { transform:rotate(0deg);   opacity:1; }
    38%  { transform:rotate(-179deg);opacity:1; }
    54%  { transform:rotate(-179deg);opacity:1; }
    56%  { transform:rotate(-179deg);opacity:0; }
    58%  { transform:rotate(0deg);   opacity:0; }
    74%  { transform:rotate(0deg);   opacity:1; }
    100% { transform:rotate(0deg);   opacity:1; }
  }

  /* writing hand + pen: small back-and-forth */
  .pen{ transform-box:fill-box; transform-origin:center; animation: write 1.15s ease-in-out infinite; }
  @keyframes write{ 0%,100%{ transform:translate(0,0) rotate(0deg);} 50%{ transform:translate(-3.5px,1.2px) rotate(-3deg);} }

  /* red ink stroke being written, then cleared */
  .mark{ fill:none; stroke:var(--accent); stroke-width:2.6; stroke-linecap:round; vector-effect:non-scaling-stroke;
    stroke-dasharray:30; animation: ink 3.8s ease-in-out infinite; }
  @keyframes ink{
    0%   { stroke-dashoffset:30; opacity:1; }
    36%  { stroke-dashoffset:0;  opacity:1; }
    66%  { stroke-dashoffset:0;  opacity:1; }
    72%  { opacity:0; }
    74%  { stroke-dashoffset:30; opacity:0; }
    100% { stroke-dashoffset:30; opacity:1; }
  }

  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; } }
  .cap{ text-align:center; margin-top:18px; font-family:var(--font-serif); color:var(--ink-muted); font-size:14px; }
</style>
</head>
<body>
<div class="scene">
  <svg class="desk-anim" viewBox="0 44 480 276" role="img" aria-label="线描小人在书桌前翻书写作">
    <!-- desk -->
    <line class="ink" x1="64" y1="236" x2="416" y2="236"/>
    <line class="ink" x1="64" y1="236" x2="64" y2="244"/>
    <line class="ink" x1="416" y1="236" x2="416" y2="244"/>
    <line class="ink" x1="64" y1="244" x2="416" y2="244"/>
    <line class="ink" x1="92" y1="244" x2="84" y2="306"/>
    <line class="ink" x1="388" y1="244" x2="396" y2="306"/>

    <!-- figure -->
    <g class="figure">
      <circle class="ink" cx="240" cy="94" r="9"/>
      <circle class="ink" cx="240" cy="118" r="26"/>
      <!-- neck -->
      <path class="ink" d="M231,141 L227,159"/>
      <path class="ink" d="M249,141 L253,159"/>
      <!-- shoulders / torso rising from behind the desk -->
      <path class="ink" d="M195,212 C193,176 214,158 240,158 C266,158 287,176 285,212"/>
      <!-- arms reaching down onto the desk toward the book -->
      <path class="ink" d="M206,168 C196,193 206,216 225,227"/>
      <path class="ink" d="M274,168 C284,193 274,216 255,226"/>
    </g>

    <!-- open book on the desk -->
    <path class="page-fill" d="M240,221 C219,213 202,215 195,222 L195,235 C202,229 219,227 240,234 Z"/>
    <path class="page-fill" d="M240,221 C261,213 278,215 285,222 L285,235 C278,229 261,227 240,234 Z"/>
    <line class="ink" x1="240" y1="221" x2="240" y2="234"/>

    <!-- the flipping leaf (covers right page as it lifts & turns over) -->
    <path class="leaf page-fill" d="M240,221 C261,213 278,215 285,222 L285,235 C278,229 261,227 240,234 Z"/>

    <!-- red ink being written on the page -->
    <path class="mark" d="M249,230 q7,-5 15,-1"/>

    <!-- pen in hand -->
    <g class="pen">
      <line class="ink" x1="255" y1="227" x2="272" y2="205"/>
      <circle class="ink accent" cx="255" cy="227" r="1.7"/>
    </g>
  </svg>
  <p class="cap">翻书 · 写作 · 连续循环</p>
</div>
</body>
</html>
