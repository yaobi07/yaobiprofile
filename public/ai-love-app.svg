  <rect x="208" y="240" width="22" height="22" rx="4" fill="#1D9E75"/>
  <rect x="242" y="240" width="22" height="22" rx="4" fill="#1D9E75"/>
  <rect x="276" y="240" width="22" height="22" rx="4" fill="#1D9E75"/>
  <rect x="310" y="240" width="22" height="22" rx="4" fill="#E8E8E8"/>
  <rect x="344" y="240" width="22" height="22" rx="4" fill="#1D9E75"/>
  <rect x="378" y="240" width="22" height="22" rx="4" fill="#1D9E75"/>
  <!-- row 4 -->
  <rect x="174" y="266" width="22" height="22" rx="4" fill="#1D9E75"/>
  <rect x="208" y="266" width="22" height="22" rx="4" fill="#E8E8E8"/>
  <rect x="242" y="266" width="22" height="22" rx="4" fill="#1D9E75"/>
  <rect x="276" y="266" width="22" height="22" rx="4" fill="#1D9E75"/>
  <rect x="310" y="266" width="22" height="22" rx="4" fill="#1D9E75"/>
  <rect x="344" y="266" width="22" height="22" rx="4" fill="#E8E8E8"/>
  <!-- today border -->
  <rect x="378" y="266" width="22" height="22" rx="4" fill="#1D9E75" stroke="#085041" stroke-width="2"/>
  <!-- row 5 -->
  <rect x="174" y="292" width="22" height="22" rx="4" fill="#E8E8E8"/>
  <rect x="208" y="292" width="22" height="22" rx="4" fill="#E8E8E8"/>
  <rect x="242" y="292" width="22" height="22" rx="4" fill="#E8E8E8"/>
