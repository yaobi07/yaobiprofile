  <!-- tab icons placeholder -->
  <circle cx="219" cy="372" r="7" fill="#1D9E75"/>
  <circle cx="261" cy="372" r="7" fill="#E8E8E8"/>
  <circle cx="300" cy="372" r="7" fill="#E8E8E8"/>
