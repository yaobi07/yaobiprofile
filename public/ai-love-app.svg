<svg width="600" height="420" viewBox="0 0 600 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- background -->
  <rect width="600" height="420" fill="#F5F5F0"/>

  <!-- phone shell -->
  <rect x="160" y="20" width="280" height="380" rx="32" fill="#1a1a1a"/>
  <rect x="166" y="26" width="268" height="368" rx="28" fill="#ffffff"/>

  <!-- status bar -->
