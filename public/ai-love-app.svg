  <!-- top bar: 在一起第 X 天 -->
  <rect x="166" y="50" width="268" height="48" fill="#ffffff"/>
  <text x="200" y="78" font-family="PingFang SC, sans-serif" font-size="13" fill="#085041" font-weight="700">在一起第 186 天</text>
  <text x="370" y="78" font-family="PingFang SC, sans-serif" font-size="11" fill="#1D9E75" text-anchor="end">见面 112 次</text>

  <!-- stats bar -->
  <rect x="178" y="102" width="244" height="44" rx="10" fill="#F0FAF6"/>
  <text x="220" y="120" font-family="PingFang SC, sans-serif" font-size="10" fill="#085041" text-anchor="middle">本月见面</text>
  <text x="220" y="136" font-family="PingFang SC, sans-serif" font-size="14" fill="#1D9E75" font-weight="700" text-anchor="middle">18</text>
  <line x1="266" y1="110" x2="266" y2="140" stroke="#1D9E75" stroke-width="0.5" opacity="0.3"/>
  <text x="300" y="120" font-family="PingFang SC, sans-serif" font-size="10" fill="#085041" text-anchor="middle">见面率</text>
  <text x="300" y="136" font-family="PingFang SC, sans-serif" font-size="14" fill="#1D9E75" font-weight="700" text-anchor="middle">60%</text>
  <line x1="334" y1="110" x2="334" y2="140" stroke="#1D9E75" stroke-width="0.5" opacity="0.3"/>
  <text x="368" y="120" font-family="PingFang SC, sans-serif" font-size="10" fill="#085041" text-anchor="middle">连续</text>
  <text x="368" y="136" font-family="PingFang SC, sans-serif" font-size="14" fill="#1D9E75" font-weight="700" text-anchor="middle">5天</text>

  <!-- month nav -->
  <text x="270" y="166" font-family="PingFang SC, sans-serif" font-size="12" fill="#333" text-anchor="middle" font-weight="600">‹  2026 年 6 月  ›</text>

