    <circle cx="260" cy="540" r="5" fill="rgba(167,139,250,0.65)"/>
    <circle cx="300" cy="480" r="4" fill="rgba(255,255,255,0.35)"/>
    <circle cx="410" cy="480" r="4" fill="rgba(255,255,255,0.35)"/>
