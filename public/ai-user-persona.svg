    <path d="M260 610L460 710" stroke="rgba(255,255,255,0.14)" stroke-width="4" stroke-linecap="round"/>
    <path d="M460 610L260 710" stroke="rgba(255,255,255,0.14)" stroke-width="4" stroke-linecap="round"/>
  </g>

