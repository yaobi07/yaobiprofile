  </defs>

  <rect x="0" y="0" width="720" height="1080" rx="56" fill="url(#bg)"/>
  <rect x="36" y="48" width="648" height="984" rx="44" fill="rgba(255,255,255,0.035)" stroke="rgba(255,255,255,0.10)"/>

